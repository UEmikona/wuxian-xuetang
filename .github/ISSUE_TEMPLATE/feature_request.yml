name: 功能建议 / Feature request
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述使用场景，而不仅仅是解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
